plugins { id 'com.android.application' }

android {
  namespace 'com.rasoleya.shabab'
  compileSdk 34
  defaultConfig {
    applicationId "com.rasoleya.shabab"
    minSdk 26
    targetSdk 34
    versionCode 2
    versionName "1.1"
  }
  signingConfigs {
    release {
      storeFile file("release.keystore")
      storePassword "shabab2026"
      keyAlias "shabab"
      keyPassword "shabab2026"
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
}
